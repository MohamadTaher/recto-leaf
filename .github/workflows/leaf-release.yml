name: Leaf Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (defaults to v<versionName> from app/build.gradle.kts)'
        required: false
        type: string
      prerelease:
        description: 'Mark the GitHub release as a pre-release'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Create the GitHub release as a draft'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build release APKs
    runs-on: 'ubuntu-24.04'
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve tag name
        id: tag
        run: |
          set -e

          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/}" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
            tag="v${version}"
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Releasing as ${tag}"

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build
        run: ./gradlew assembleRelease
        env:
          # Only take over the signing config when a signing key is actually configured;
          # otherwise the release build falls back to the local debug keystore.
          MIHON_GITHUB_RELEASE: ${{ secrets.SIGNING_KEY != '' }}
          storeFileBase64: ${{ secrets.SIGNING_KEY }}
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APKs
        run: |
          set -e

          tag="${{ steps.tag.outputs.tag }}"
          out=app/build/outputs/apk/release

          mv "$out/app-universal-release.apk" "leaf-${tag}.apk"
          mv "$out/app-arm64-v8a-release.apk" "leaf-arm64-v8a-${tag}.apk"
          mv "$out/app-armeabi-v7a-release.apk" "leaf-armeabi-v7a-${tag}.apk"
          mv "$out/app-x86-release.apk" "leaf-x86-${tag}.apk"
          mv "$out/app-x86_64-release.apk" "leaf-x86_64-${tag}.apk"

          sha256sum leaf-*.apk | tee checksums-${tag}.sha256

      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leaf-release
          path: |
            leaf-*.apk
            checksums-*.sha256

      - name: Upload mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapping-${{ steps.tag.outputs.tag }}
          path: app/build/outputs/mapping/release

  release:
    name: Create GitHub Release
    runs-on: 'ubuntu-24.04'
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: leaf-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Leaf ${{ needs.build.outputs.tag }}
          body: |
            Release build of Leaf ${{ needs.build.outputs.tag }}, built from `${{ github.sha }}`.

            > [!TIP]
            >
            > ### If you are unsure which version to download then go with `leaf-${{ needs.build.outputs.tag }}.apk`

            SHA-256 checksums are attached as `checksums-${{ needs.build.outputs.tag }}.sha256`.
          files: |
            leaf-*.apk
            checksums-*.sha256
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          token: ${{ secrets.GITHUB_TOKEN }}
